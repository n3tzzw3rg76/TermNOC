# ==============================================================================
# Debian 13 (Trixie) Unattended Preseed Template (Generic for Public Git)
# ==============================================================================

# 1. Localization & Keyboard (English system, Swiss DE-CH keymap)
d-i debian-installer/language string en
d-i debian-installer/country string CH
d-i debian-installer/locale string en_US.UTF-8
d-i localechooser/supported-locales multiselect en_US.UTF-8, de_CH.UTF-8
d-i keyboard-configuration/xkb-keymap select ch(de)
d-i keyboard-configuration/layoutcode string ch
d-i keyboard-configuration/variantcode string de
d-i keyboard-configuration/toggle select No toggling
d-i console-setup/ask_detect boolean false
d-i console-setup/layoutcode string ch
d-i console-setup/charmap select UTF-8

# 2. Network (DHCP)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string deb13-node
d-i netcfg/get_domain string lan
d-i netcfg/wireless_wep string

# 3. Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# 4. Clock & Timezone
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Zurich
d-i clock-setup/ntp boolean true

# 5. Partitioning (Entire disk, atomic regular)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# 6. User Account (GENERIC DEFAULTS - CHANGE BEFORE OR DURING PROVISIONING)
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Debian Administrator
d-i passwd/username string debianadmin
d-i passwd/user-password password ChangeMe123!
d-i passwd/user-password-again password ChangeMe123!
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

# 7. Packages
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl qemu-guest-agent
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# 8. GRUB Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

# 9. Late Command: Sudoers group
d-i preseed/late_command string \
    in-target sh -c 'usermod -aG sudo debianadmin'

# 10. Finish & Reboot
d-i finish-install/reboot_in_progress note
